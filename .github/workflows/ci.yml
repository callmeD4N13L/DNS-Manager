name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel a running build when a new commit lands on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-msvc:
    name: Windows MSVC 2022 - ${{ matrix.build_type }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: vs2022-debug
            build_type: Debug
          - preset: vs2022-release
            build_type: Release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          arch: 'win64_msvc2022_64'
          cache: true

      - name: Configure
        shell: pwsh
        run: |
          $qtRoot = $env:QT_ROOT_DIR
          Write-Host "QT_ROOT_DIR = $qtRoot"
          # Guard against a known install-qt-action quirk where QT_ROOT_DIR
          # can point at bin\qmake.exe instead of the Qt prefix root.
          if ($qtRoot -match 'bin[\\/]qmake[^\\/]*\.exe$') {
            $qtRoot = Split-Path -Parent (Split-Path -Parent $qtRoot)
            Write-Host "Normalized QT_ROOT = $qtRoot"
          }
          $cmakeArgs = @()
          if (-not [string]::IsNullOrWhiteSpace($qtRoot)) {
            $cmakeArgs += "-DQT_ROOT=`"$qtRoot`""
          } else {
            Write-Warning 'QT_ROOT_DIR unset; relying on PATH / C:\Qt auto-detection'
          }
          cmake --preset ${{ matrix.preset }} @cmakeArgs

      - name: Build
        shell: pwsh
        run: cmake --build --preset ${{ matrix.preset }} --config ${{ matrix.build_type }}

      - name: Test
        shell: pwsh
        run: ctest --test-dir build/${{ matrix.preset }} -C ${{ matrix.build_type }} --output-on-failure
