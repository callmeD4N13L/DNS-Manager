appId: com.dnsmanager.app
productName: Dancy
copyright: Copyright © DnsManager Contributors
# Modular + lightweight: the UI ships as an asar bundle, the C++ backend as a
# separate sidecar (resources/bin/dns-core.exe) so each layer can be serviced
# or rebuilt independently. No Qt UI runtime is bundled.
asar: true
compression: maximum
removePackageScripts: true
npmRebuild: false
buildDependenciesFromSource: false
directories:
  app: .
  output: release
files:
  - electron/dist/**/*
  - renderer/dist/**/*
  - package.json
  - "!**/*.map"
  - "!**/*.ts"
  - "!node_modules/**/test/**"
  - "!node_modules/**/tests/**"
  - "!node_modules/**/*.md"
extraResources:
  - from: ../build/ninja-release/dns-core.exe
    to: bin/dns-core.exe
  - from: ../resources/win/app.ico
    to: app.ico
win:
  target:
    - target: nsis
      arch: [x64, ia32]
    - target: portable
      arch: [x64, ia32]
  icon: ../resources/win/app.ico
  requestedExecutionLevel: asInvoker
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  differentialPackage: false
  packElevateHelper: false
  shortcutName: Dancy
  uninstallDisplayName: Dancy
  artifactName: DNSManager-${version}-windows-${arch}-setup-electron.exe
portable:
  artifactName: DNSManager-${version}-windows-${arch}-portable.exe
